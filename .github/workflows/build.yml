name: Build DesktopPet

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  build:
    name: Build ${{ matrix.scheme }} package
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        scheme: [rootless, roothide]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang perl git curl dpkg-dev fakeroot
          curl -L --fail --retry 3 -o /tmp/ldid https://github.com/ProcursusTeam/ldid/releases/download/v2.1.5-procursus7/ldid_linux_x86_64
          sudo install -m 0755 /tmp/ldid /usr/local/bin/ldid
          ldid --version || true

      - name: Install Theos
        run: |
          if [ "${{ matrix.scheme }}" = "roothide" ]; then
            git clone --recursive --depth=1 https://github.com/roothide/theos.git "$HOME/theos"
          else
            git clone --recursive --depth=1 https://github.com/theos/theos.git "$HOME/theos"
          fi
          echo "THEOS=$HOME/theos" >> "$GITHUB_ENV"
          echo "PATH=$HOME/theos/bin:$PATH" >> "$GITHUB_ENV"

      - name: Install iOS toolchain
        run: |
          curl -L --fail --retry 3 -o /tmp/linux-ios-toolchain.tar.lzma https://github.com/sbingner/llvm-project/releases/latest/download/linux-ios-arm64e-clang-toolchain.tar.lzma
          mkdir -p /tmp/ios-toolchain "$THEOS/toolchain/linux/iphone"
          tar --lzma -xf /tmp/linux-ios-toolchain.tar.lzma -C /tmp/ios-toolchain
          cp -a /tmp/ios-toolchain/ios-arm64e-clang-toolchain/. "$THEOS/toolchain/linux/iphone/"
          test -x "$THEOS/toolchain/linux/iphone/bin/clang"

      - name: Install iOS SDK
        run: |
          curl -L --fail --retry 3 -o /tmp/iPhoneOS16.5.sdk.tar.xz https://github.com/theos/sdks/releases/download/master-146e41f/iPhoneOS16.5.sdk.tar.xz
          mkdir -p "$THEOS/sdks"
          tar -xJf /tmp/iPhoneOS16.5.sdk.tar.xz -C "$THEOS/sdks"
          test -d "$THEOS/sdks/iPhoneOS16.5.sdk"

      - name: Build package
        env:
          THEOS_PACKAGE_SCHEME: ${{ matrix.scheme }}
        run: |
          make clean package FINALPACKAGE=1 THEOS_PACKAGE_SCHEME="$THEOS_PACKAGE_SCHEME"

      - name: Upload Debian package
        uses: actions/upload-artifact@v4
        with:
          name: DesktopPet-${{ matrix.scheme }}
          path: packages/*.deb
          if-no-files-found: error
